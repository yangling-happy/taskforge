services:
  mysql:
    image: mysql:8
    container_name: taskforge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskforge
    ports:
      - "3307:3306" # 宿主机 3306 被本地 MySQL 占用，映射到 3307
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: taskforge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduler:
    build: .
    container_name: taskforge-scheduler
    command: java -jar /app/scheduler.jar
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taskforge?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
      DB_USER: root
      DB_PASS: root
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker-a:
    build: .
    container_name: taskforge-worker-a
    command: java -jar /app/worker.jar
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      scheduler: { condition: service_healthy }
    environment:
      REDIS_HOST: redis
      SCHEDULER_URL: http://scheduler:8080
      WORKER_ID: worker-A

  worker-b:
    build: .
    container_name: taskforge-worker-b
    command: java -jar /app/worker.jar
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      scheduler: { condition: service_healthy }
    environment:
      REDIS_HOST: redis
      SCHEDULER_URL: http://scheduler:8080
      WORKER_ID: worker-B

volumes:
  mysql-data:
